# yaml-language-server: $schema=config.schema.json
env: prod  # dev or prod

server:
  host: 0.0.0.0
  port: 8080

database:
  driver: sqlite
  dsn: /var/lib/grantsy/grantsy.db
  namespace: grantsy  # optional: isolates tables from other apps sharing the same database

entitlements:
  # default_plan is optional. If set, users without subscription get this plan.
  # If not set, users without subscription have no plan and no features.
  default_plan: "free"

  # default_language is the fallback used when the request's Accept-Language has
  # no match. Optional, defaults to "en". Every name/description map below must
  # include this language.
  default_language: en

  # name/description are locale -> string maps. The API returns the language
  # negotiated from the Accept-Language header, falling back to default_language.
  plans:
    - id: free
      name: { en: Free }
      features: [dashboard]
    - id: pro
      name: { en: Pro, es: Profesional }
      description: { en: Professional plan, es: Plan profesional }
      features: [dashboard, api, sso]
    - id: enterprise
      name: { en: Enterprise }
      features: [dashboard, api, sso, audit, custom_branding]

  features:
    - id: dashboard
      name: { en: Dashboard }
      description: { en: Basic dashboard access }
    - id: api
      name: { en: API Access, es: Acceso a la API }
      description: { en: REST API access, es: Acceso a la API REST }
    - id: sso
      name: { en: Single Sign-On }
      description: { en: SAML/OIDC integration }
    - id: audit
      name: { en: Audit Logs }
      description: { en: Activity audit trail }
    - id: custom_branding
      name: { en: Custom Branding }
      description: { en: White-label customization }

auth:
  api_key: "${API_KEY}"

providers:
  lemonsqueezy:
    products:
      - product_id: 12345
        plan_id: pro
      - product_id: 67890
        plan_id: enterprise
    webhook:
      secret: "${LEMONSQUEEZY_WEBHOOK_SECRET}"
    api_key: "${LEMONSQUEEZY_API_KEY}"

# Outgoing webhooks (optional) - notify external services of subscription changes
webhooks:
  endpoints:
    - url: "https://your-app.com/webhooks/grantsy"
      secret: "${OUTGOING_WEBHOOK_SECRET}"

log:
  level: info
  format: json

metrics:
  enable: true
  go_metrics: false
  path: /metrics
